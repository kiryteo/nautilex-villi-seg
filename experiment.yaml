version: v2
description: "Nautilex villi segmentation — v4k: confidence-scored + gentle smoothing (IoU fix)"

tasks:
  - name: segment
    image:
      beaker: ashwin-samudre/villi-seg-v4k
    context:
      cluster: ai1/octo.hub-gcp-h200
      priority: normal
    resources:
      gpuCount: 1
    envVars:
      - name: DATA_PATH
        value: /data
      - name: OUTPUT_DIR
        value: /output
      - name: METHOD
        value: unet,multimodal,ensemble
    datasets:
      - mountPath: /data
        source:
          beaker: ashwin-samudre/xenium-TIS09474-001-001
    result:
      path: /output
